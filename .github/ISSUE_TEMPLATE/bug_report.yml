name: "🐞 Reporte de error"
description: Informa un error en la aplicación o un texto litúrgico incorrecto.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Si es un error litúrgico (texto, referencia bíblica),
        incluye la referencia correcta del **LOC 1928** para poder verificarla.
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del error
      description: ¿Qué ocurre? ¿Qué esperabas que ocurriera?
    validations:
      required: true
  - type: input
    id: pagina
    attributes:
      label: Página / sección afectada
      placeholder: "Ej: /oficio/oracion-matutina"
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: fuente
    attributes:
      label: Referencia correcta (si es error litúrgico)
      description: Cita del LOC 1928 que respalda la corrección.
    validations:
      required: false
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Ej: Chrome 120 en Windows, iPhone Safari, etc."
    validations:
      required: false
